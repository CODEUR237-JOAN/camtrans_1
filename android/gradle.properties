org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024M -XX:ReservedCodeCacheSize=512M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx2048M -Xms512M
android.useAndroidX=true
org.gradle.java.home=C:/src/jdk-17.0.16+8

# Active le démon Gradle pour un démarrage plus rapide
org.gradle.daemon=true

# Permet l'exécution parallèle sur les modules indépendants
org.gradle.parallel=true

# Active la mise en cache pour réutiliser les sorties de build intermédiaires
org.gradle.caching=true

# Désactiver le cache de configuration moderne pour éviter l'erreur avec DebugMinSdkCheck
org.gradle.configuration-cache=false